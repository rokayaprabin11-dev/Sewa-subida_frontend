<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sewa Subidha Gardening Admin</title>
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://unpkg.com; style-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com; font-src 'self' https://cdnjs.cloudflare.com; connect-src 'self' https://sewa-subida-backend-a4d9.onrender.com https://sewa-subidabackend-production.up.railway.app; img-src 'self' data: https://res.cloudinary.com https://*; object-src 'none';" />
  <link rel="preload" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" as="style" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" media="print" onload="this.media='all'" />
  <noscript>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  </noscript>
  <link rel="stylesheet" href="admin.css" />
</head>
<body>
  <div id="root"></div>
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <script type="text/babel" data-presets="react">
    const { useState, useEffect, useCallback } = React;

    // ─── CONFIG ───────────────────────────────────────────────────────────────
    const API_BASE = "https://sewa-subida-backend-a4d9.onrender.com";

    async function apiFetch(path, options = {}, token = null) {
      const isFormData = options.body instanceof FormData;
      const res = await fetch(`${API_BASE}${path}`, {
        ...options,
        headers: {
          ...(isFormData ? {} : { "Content-Type": "application/json" }),
          ...(token ? { Authorization: `Bearer ${token}` } : {}),
          ...options.headers,
        },
      });
      const text = await res.text();
      if (!res.ok) {
        const msg = (() => { try { return JSON.parse(text).error; } catch { return text || res.statusText; } })();
        throw new Error(msg);
      }
      return text ? JSON.parse(text) : null;
    }

    // ─── DB MAPPERS ───────────────────────────────────────────────────────────
    function galleryFromDb(r) { return { ...r, desc: r.description }; }
    function galleryToDb(item) { const { desc, ...rest } = item; return { ...rest, description: desc }; }
    function pricingFromDb(r) { return { ...r, desc: r.description, ctaStyle: r.cta_style }; }
    function pricingToDb(plan) { const { desc, ctaStyle, ...rest } = plan; return { ...rest, description: desc, cta_style: ctaStyle }; }

    // ─── STYLES ───────────────────────────────────────────────────────────────
    const inputStyle  = { width: "100%", padding: "10px 14px", border: "1.5px solid #d8e8d0", borderRadius: 10, fontSize: 14, color: "#262622", background: "#fafdf8", outline: "none", fontFamily: "inherit", boxSizing: "border-box" };
    const selectStyle = { ...inputStyle, appearance: "none" };
    const CATEGORIES  = ["modern", "tropical", "lawn", "patio", "events", "irrigation"];
    const BUDGETS     = ["$", "$$", "$$$", "$$$$"];
    const catColors   = { modern: "#5a8aad", tropical: "#2D5A27", lawn: "#3a7a2a", patio: "#b8884a", events: "#9b5ea3", irrigation: "#1a6b8a" };

    // ─── TOAST ────────────────────────────────────────────────────────────────
    function Toast({ msg, onClose }) {
      useEffect(() => { const t = setTimeout(onClose, 3000); return () => clearTimeout(t); }, []);
      return (
        <div className="admin-s-01">
          <i className="fa-solid fa-check admin-s-02"></i> {msg}
        </div>
      );
    }

    // ─── MODAL ────────────────────────────────────────────────────────────────
    function Modal({ title, onClose, children }) {
      return (
        <div className="admin-s-03" onClick={e => e.target === e.currentTarget && onClose()}>
          <div className="admin-s-04">
            <div className="admin-s-05">
              <h3 className="admin-s-06">{title}</h3>
              <button onClick={onClose} className="admin-s-07">✕</button>
            </div>
            {children}
          </div>
        </div>
      );
    }

    function Field({ label, children }) {
      return (
        <div className="admin-s-08">
          <label className="admin-s-09">{label}</label>
          {children}
        </div>
      );
    }

    // ─── IMAGE UPLOADER ───────────────────────────────────────────────────────
    function ImageUploader({ token, value, onChange }) {
      const [uploading, setUploading] = useState(false);
      const [preview,   setPreview]   = useState(value || "");
      const [error,     setError]     = useState("");

      const handleFile = async (e) => {
        const file = e.target.files[0];
        if (!file) return;
        setUploading(true); setError("");

        // Local preview
        const reader = new FileReader();
        reader.onload = ev => setPreview(ev.target.result);
        reader.readAsDataURL(file);

        try {
          const formData = new FormData();
          formData.append("image", file);
          const data = await apiFetch("/api/upload", { method: "POST", body: formData }, token);
          onChange(data.url);
          setPreview(data.url);
        } catch (err) {
          setError("Upload failed: " + err.message);
          setPreview(value || "");
        } finally {
          setUploading(false);
        }
      };

      return (
        <div>
          {/* Upload button */}
          <label className="admin-s-10">
            <input type="file" accept="image/*" onChange={handleFile} className="admin-s-11" disabled={uploading} />
            {uploading ? (
              <>
                <div className="admin-s-12" />
                <span className="admin-s-13">Uploading to Cloudinary…</span>
              </>
            ) : (
              <>
                <i className="fa-solid fa-camera admin-s-02"></i>
                <span className="admin-s-14">
                  {preview ? "Change Image" : "Upload Image"}
                </span>
                <span className="admin-s-15">JPG, PNG, WebP · max 10MB</span>
              </>
            )}
          </label>

          {error && <p className="admin-s-16">{error}</p>}

          {/* Preview */}
          {preview && (
            <div className="admin-s-17">
              <img src={preview} alt="preview" className="admin-s-18" />
              <button onClick={() => { setPreview(""); onChange(""); }} style={{ position: "absolute", top: 8, right: 8, background: "rgba(220,38,38,0.85)", color: "#fff", border: "none", borderRadius: "50%", width: 26, height: 26, cursor: "pointer", fontSize: 14, display: "flex", alignItems: "center", justifyContent: "center" }}>✕</button>
            </div>
          )}

          {/* Manual URL fallback */}
          <div className="admin-s-19">
            <input style={{ ...inputStyle, fontSize: 12, color: "#7A7A72" }} value={value} onChange={e => { onChange(e.target.value); setPreview(e.target.value); }} placeholder="Or paste image URL manually" />
          </div>
        </div>
      );
    }

    // ─── GALLERY FORM ─────────────────────────────────────────────────────────
    function GalleryForm({ item, onSave, onClose, loading, token }) {
      const blank = { title: "", cat: "modern", desc: "", service: "", duration: "", location: "", budget: "$$", height: 180, bg: "linear-gradient(145deg,#c8e6b0,#4A7C40)", image: "" };
      const [form, setForm] = useState(item || blank);
      const set = (k, v) => setForm(f => ({ ...f, [k]: v }));
      return (
        <>
          <Field label="Title"><input style={inputStyle} value={form.title} onChange={e => set("title", e.target.value)} placeholder="Project name" /></Field>
          <div className="admin-s-20">
            <Field label="Category">
              <select style={selectStyle} value={form.cat} onChange={e => set("cat", e.target.value)}>
                {CATEGORIES.map(c => <option key={c} value={c}>{c.charAt(0).toUpperCase() + c.slice(1)}</option>)}
              </select>
            </Field>
            <Field label="Budget">
              <select style={selectStyle} value={form.budget} onChange={e => set("budget", e.target.value)}>
                {BUDGETS.map(b => <option key={b} value={b}>{b}</option>)}
              </select>
            </Field>
          </div>
          <Field label="Description">
            <textarea style={{ ...inputStyle, minHeight: 80, resize: "vertical" }} value={form.desc} onChange={e => set("desc", e.target.value)} />
          </Field>
          <div className="admin-s-20">
            <Field label="Service"><input style={inputStyle} value={form.service} onChange={e => set("service", e.target.value)} placeholder="e.g. Garden Design" /></Field>
            <Field label="Duration"><input style={inputStyle} value={form.duration} onChange={e => set("duration", e.target.value)} placeholder="e.g. 2 Weeks" /></Field>
            <Field label="Location"><input style={inputStyle} value={form.location} onChange={e => set("location", e.target.value)} placeholder="e.g. Kathmandu" /></Field>
            <Field label="Card Height (px)"><input style={inputStyle} type="number" value={form.height} onChange={e => set("height", +e.target.value)} /></Field>
          </div>
          <Field label="Project Image">
            <ImageUploader token={token} value={form.image} onChange={url => set("image", url)} />
          </Field>
          <Field label="Fallback Background Gradient">
            <input style={inputStyle} value={form.bg} onChange={e => set("bg", e.target.value)} />
          </Field>
          <div style={{ marginTop: 8, padding: 12, borderRadius: 10, background: form.bg, height: 48, border: "1.5px solid #e0e8dc" }} />
          <div className="admin-s-21">
            <button onClick={onClose} className="admin-s-22">Cancel</button>
            <button onClick={() => onSave(form)} disabled={loading} style={{ padding: "10px 22px", background: "#2A5726", color: "#fff", border: "none", borderRadius: 100, cursor: loading ? "not-allowed" : "pointer", fontSize: 14, fontWeight: 600, opacity: loading ? 0.7 : 1 }}>
              {loading ? "Saving…" : "Save Item"}
            </button>
          </div>
        </>
      );
    }

    // ─── PRICING FORM ─────────────────────────────────────────────────────────
    function PricingForm({ plan, onSave, onClose, loading }) {
      const blank = { name: "", icon: "fa-leaf", desc: "", price: "", period: "/month", note: "Billed monthly · Cancel anytime", popular: false, ctaStyle: "outline", features: [{ text: "", enabled: true }] };
      const [form, setForm] = useState(plan ? JSON.parse(JSON.stringify(plan)) : blank);
      const set      = (k, v) => setForm(f => ({ ...f, [k]: v }));
      const setFeat  = (i, k, v) => setForm(f => { const feats = [...f.features]; feats[i] = { ...feats[i], [k]: v }; return { ...f, features: feats }; });
      const addFeat  = () => setForm(f => ({ ...f, features: [...f.features, { text: "", enabled: true }] }));
      const removeFeat = i => setForm(f => ({ ...f, features: f.features.filter((_, idx) => idx !== i) }));
      return (
        <>
          <div className="admin-s-20">
            <Field label="Plan Name"><input style={inputStyle} value={form.name} onChange={e => set("name", e.target.value)} /></Field>
            <Field label="FA Icon class"><input style={inputStyle} value={form.icon} onChange={e => set("icon", e.target.value)} placeholder="fa-leaf" /></Field>
            <Field label="Price (Rs.)"><input style={inputStyle} value={form.price} onChange={e => set("price", e.target.value)} placeholder="5,500" /></Field>
            <Field label="Period"><input style={inputStyle} value={form.period} onChange={e => set("period", e.target.value)} placeholder="/month" /></Field>
          </div>
          <Field label="Description"><textarea style={{ ...inputStyle, minHeight: 60, resize: "vertical" }} value={form.desc} onChange={e => set("desc", e.target.value)} /></Field>
          <Field label="Note"><input style={inputStyle} value={form.note} onChange={e => set("note", e.target.value)} /></Field>
          <div className="admin-s-23">
            <label className="admin-s-24">
              <input type="checkbox" checked={form.popular} onChange={e => set("popular", e.target.checked)} /> Mark as "Most Popular"
            </label>
            <Field label="CTA Style">
              <select style={{ ...selectStyle, width: "auto" }} value={form.ctaStyle} onChange={e => set("ctaStyle", e.target.value)}>
                <option value="primary">Primary (filled)</option>
                <option value="outline">Outline</option>
              </select>
            </Field>
          </div>
          <label className="admin-s-25">Features</label>
          <div className="admin-s-26">
            {form.features.map((f, i) => (
              <div key={i} className="admin-s-27">
                <input type="checkbox" checked={f.enabled} onChange={e => setFeat(i, "enabled", e.target.checked)} />
                <input style={{ ...inputStyle, flex: 1 }} value={f.text} onChange={e => setFeat(i, "text", e.target.value)} placeholder="Feature description" />
                <button onClick={() => removeFeat(i)} style={{ background: "#fee2e2", border: "none", borderRadius: 8, width: 30, height: 30, cursor: "pointer", color: "#dc2626", fontWeight: "bold", flexShrink: 0 }}>×</button>
              </div>
            ))}
            <button onClick={addFeat} className="admin-s-28">+ Add Feature</button>
          </div>
          <div className="admin-s-21">
            <button onClick={onClose} className="admin-s-22">Cancel</button>
            <button onClick={() => onSave(form)} disabled={loading} style={{ padding: "10px 22px", background: "#2A5726", color: "#fff", border: "none", borderRadius: 100, cursor: loading ? "not-allowed" : "pointer", fontSize: 14, fontWeight: 600, opacity: loading ? 0.7 : 1 }}>
              {loading ? "Saving…" : "Save Plan"}
            </button>
          </div>
        </>
      );
    }

    // ─── ARRIVALS FORM ────────────────────────────────────────────────────────
    const ARR_CATS   = ["indoor","outdoor","flowering","tools","soil"];
    const ARR_BADGES = ["new","hot","sale","limited","best",""];
    const ARR_BGS    = [{ value: "",      label: "Default (green-pale)" },
                        { value: "sage",  label: "Sage (muted green)" },
                        { value: "sand",  label: "Sand (warm tan)" },
                        { value: "gold",  label: "Gold (pale amber)" }];

    function ArrivalsForm({ item, onSave, onClose, loading, token }) {
      const blank = {
        name: "", latin_name: "", cat: "indoor", cat_label: "", badge: "new",
        img_bg: "", emoji: "fa-solid fa-leaf", image: "",
        stars: 5, review_count: 0, care_tags: [{ icon: "fa-solid fa-sun", label: "" }],
        popular: 50,
      };
      const [form, setForm] = useState(item ? JSON.parse(JSON.stringify(item)) : blank);
      const set = (k, v) => setForm(f => ({ ...f, [k]: v }));
      const setTag  = (i, k, v) => setForm(f => { const t=[...f.care_tags]; t[i]={...t[i],[k]:v}; return {...f,care_tags:t}; });
      const addTag  = () => setForm(f => ({ ...f, care_tags: [...f.care_tags, { icon: "fa-solid fa-leaf", label: "" }] }));
      const rmTag   = i => setForm(f => ({ ...f, care_tags: f.care_tags.filter((_,idx)=>idx!==i) }));

      return (
        <>
          <div className="admin-s-20">
            <Field label="Product Name">
              <input style={inputStyle} value={form.name} onChange={e=>set("name",e.target.value)} placeholder="e.g. Monstera Deliciosa" />
            </Field>
            <Field label="Latin / Subtitle">
              <input style={inputStyle} value={form.latin_name||""} onChange={e=>set("latin_name",e.target.value)} placeholder="e.g. Swiss Cheese Plant" />
            </Field>
            <Field label="Category (filter key)">
              <select style={selectStyle} value={form.cat} onChange={e=>set("cat",e.target.value)}>
                {ARR_CATS.map(c=><option key={c} value={c}>{c.charAt(0).toUpperCase()+c.slice(1)}</option>)}
              </select>
            </Field>
            <Field label="Category Label (display)">
              <input style={inputStyle} value={form.cat_label||""} onChange={e=>set("cat_label",e.target.value)} placeholder="e.g. Indoor · Tropical" />
            </Field>
            <Field label="Badge">
              <select style={selectStyle} value={form.badge||""} onChange={e=>set("badge",e.target.value)}>
                {ARR_BADGES.map(b=><option key={b} value={b}>{b||"(none)"}</option>)}
              </select>
            </Field>
            <Field label="Card Background">
              <select style={selectStyle} value={form.img_bg||""} onChange={e=>set("img_bg",e.target.value)}>
                {ARR_BGS.map(b=><option key={b.value} value={b.value}>{b.label}</option>)}
              </select>
            </Field>
            <Field label="Icon Class (if no photo)">
              <input style={inputStyle} value={form.emoji||"fa-solid fa-leaf"} onChange={e=>set("emoji",e.target.value)} placeholder="fa-solid fa-leaf" />
            </Field>
            <Field label="Popularity (0–100)">
              <input style={inputStyle} type="number" min="0" max="100" value={form.popular||50} onChange={e=>set("popular",+e.target.value)} />
            </Field>
            <Field label="Stars (1–5)">
              <select style={selectStyle} value={form.stars||5} onChange={e=>set("stars",+e.target.value)}>
                {[5,4,3,2,1].map(n=><option key={n} value={n}>{"★".repeat(n)+"☆".repeat(5-n)}</option>)}
              </select>
            </Field>
            <Field label="Review Count">
              <input style={inputStyle} type="number" min="0" value={form.review_count||0} onChange={e=>set("review_count",+e.target.value)} placeholder="42" />
            </Field>
          </div>

          <Field label="Product Photo (optional)">
            <ImageUploader token={token} value={form.image||""} onChange={url=>set("image",url)} />
          </Field>

          <div className="admin-s-29">
            <label className="admin-s-25">Care Tags</label>
          </div>
          <div className="admin-s-30">
            {(form.care_tags||[]).map((ct, i) => (
              <div key={i} className="admin-s-27">
                <input style={{ ...inputStyle, flex: "0 0 220px", fontSize: 12 }} value={ct.icon} onChange={e=>setTag(i,"icon",e.target.value)} placeholder="fa-solid fa-sun" />
                <input style={{ ...inputStyle, flex: 1, fontSize: 12 }} value={ct.label} onChange={e=>setTag(i,"label",e.target.value)} placeholder="Label (e.g. Full sun)" />
                <button onClick={()=>rmTag(i)} style={{ background:"#fee2e2",border:"none",borderRadius:8,width:30,height:30,cursor:"pointer",color:"#dc2626",fontWeight:"bold",flexShrink:0 }}>×</button>
              </div>
            ))}
            <button onClick={addTag} className="admin-s-28">+ Add Care Tag</button>
          </div>

          <div className="admin-s-31">
            <strong>Common icons:</strong> fa-solid fa-sun · fa-solid fa-droplet · fa-solid fa-wind · fa-solid fa-seedling · fa-solid fa-recycle · fa-solid fa-fire · fa-solid fa-star · fa-solid fa-shield
          </div>

          <div className="admin-s-32">
            <button onClick={onClose} className="admin-s-22">Cancel</button>
            <button onClick={() => onSave(form)} disabled={loading || !form.name} style={{ padding: "10px 22px", background: "#2A5726", color: "#fff", border: "none", borderRadius: 100, cursor: loading||!form.name ? "not-allowed" : "pointer", fontSize: 14, fontWeight: 600, opacity: loading||!form.name ? 0.7 : 1 }}>
              {loading ? "Saving…" : "Save Product"}
            </button>
          </div>
        </>
      );
    }

    // ─── LOGIN ────────────────────────────────────────────────────────────────
    function LoginScreen({ onLogin }) {
      const [password, setPassword] = useState("");
      const [error, setError]       = useState("");
      const [loading, setLoading]   = useState(false);

      const submit = async () => {
        if (!password) return;
        setLoading(true); setError("");
        try {
          const data = await apiFetch("/api/login", { method: "POST", body: JSON.stringify({ password }) });
          onLogin(data.token);
        } catch (e) {
          setError(e.message || "Incorrect password");
        } finally { setLoading(false); }
      };

      return (
        <div className="admin-s-33">
          <div className="admin-s-34">
            <img src="images/logo.webp" alt="Sewa Subidha Gardening" className="admin-s-35" />
            <h1 className="admin-s-36">Sewa Subidha Gardening Admin</h1>
            <p className="admin-s-37">Enter the admin password to continue</p>
            <input type="password" placeholder="Password" value={password} onChange={e => setPassword(e.target.value)} onKeyDown={e => e.key === "Enter" && submit()} style={{ ...inputStyle, marginBottom: 12, textAlign: "center", letterSpacing: 2 }} autoFocus />
            {error && <div className="admin-s-38">{error}</div>}
            <button onClick={submit} disabled={loading || !password} style={{ width: "100%", padding: "12px", background: "#2A5726", color: "#fff", border: "none", borderRadius: 100, cursor: loading || !password ? "not-allowed" : "pointer", fontSize: 15, fontWeight: 600, opacity: loading || !password ? 0.7 : 1 }}>
              {loading ? "Checking…" : "Sign In →"}
            </button>
          </div>
        </div>
      );
    }

    // ─── MAIN APP ─────────────────────────────────────────────────────────────
    function App() {
      const [token, setToken]       = useState(() => sessionStorage.getItem("gs_token") || null);
      const [tab, setTab]           = useState("gallery");
      const [gallery, setGallery]   = useState([]);
      const [pricing, setPricing]   = useState([]);
      const [arrivals, setArrivals] = useState([]);
      const [modal, setModal]       = useState(null);
      const [toast, setToast]       = useState(null);
      const [loading, setLoading]   = useState(true);
      const [saving, setSaving]     = useState(false);
      const [error, setError]       = useState(null);

      const showToast  = msg => setToast(msg);
      const handleLogin  = t => { sessionStorage.setItem("gs_token", t); setToken(t); };
      const handleLogout = () => { sessionStorage.removeItem("gs_token"); setToken(null); };
      const api = useCallback((path, opts) => apiFetch(path, opts, token), [token]);

      useEffect(() => { if (token) loadAll(); }, [token]);

      async function loadAll() {
        setLoading(true); setError(null);
        try {
          const [gRows, pRows, aRows] = await Promise.all([
            api("/api/gallery"),
            api("/api/pricing"),
            api("/api/arrivals"),
          ]);
          setGallery(gRows.map(galleryFromDb));
          setPricing(pRows.map(pricingFromDb));
          setArrivals(aRows);
        } catch (e) {
          if (e.message?.includes("Invalid") || e.message?.includes("token")) handleLogout();
          else setError("Could not connect to the API: " + e.message);
        } finally { setLoading(false); }
      }

      // ── Gallery CRUD ─────────────────────────────────────────────────────────
      const saveGalleryItem = async (item) => {
        setSaving(true);
        try {
          const dbItem = galleryToDb(item);
          if (item.id) {
            const { id, created_at, ...fields } = dbItem;
            await api(`/api/gallery/${item.id}`, { method: "PATCH", body: JSON.stringify(fields) });
            setGallery(g => g.map(x => x.id === item.id ? { ...item } : x));
            showToast("Gallery item updated!");
          } else {
            const row = await api("/api/gallery", { method: "POST", body: JSON.stringify({ ...dbItem, sort_order: gallery.length }) });
            setGallery(g => [...g, galleryFromDb(row)]);
            showToast("Gallery item added!");
          }
          setModal(null);
        } catch (e) { showToast("Error: " + e.message); }
        finally { setSaving(false); }
      };

      const deleteGallery = async (id) => {
        setSaving(true);
        try { await api(`/api/gallery/${id}`, { method: "DELETE" }); setGallery(g => g.filter(x => x.id !== id)); showToast("Item deleted."); }
        catch (e) { showToast("Error: " + e.message); }
        finally { setSaving(false); }
      };

      const moveGallery = async (id, dir) => {
        const arr = [...gallery]; const i = arr.findIndex(x => x.id === id); const j = i + dir;
        if (j < 0 || j >= arr.length) return;
        [arr[i], arr[j]] = [arr[j], arr[i]]; setGallery(arr);
        try { await Promise.all([api(`/api/gallery/${arr[i].id}`, { method: "PATCH", body: JSON.stringify({ sort_order: i }) }), api(`/api/gallery/${arr[j].id}`, { method: "PATCH", body: JSON.stringify({ sort_order: j }) })]); }
        catch (e) { showToast("Reorder failed: " + e.message); }
      };

      // ── Pricing CRUD ─────────────────────────────────────────────────────────
      const savePricing = async (plan) => {
        setSaving(true);
        try {
          const dbPlan = pricingToDb(plan);
          if (plan.id) {
            const { id, created_at, ...fields } = dbPlan;
            await api(`/api/pricing/${plan.id}`, { method: "PATCH", body: JSON.stringify(fields) });
            setPricing(p => p.map(x => x.id === plan.id ? { ...plan } : x));
            showToast("Plan updated!");
          } else {
            const row = await api("/api/pricing", { method: "POST", body: JSON.stringify({ ...dbPlan, sort_order: pricing.length }) });
            setPricing(p => [...p, pricingFromDb(row)]);
            showToast("Plan added!");
          }
          setModal(null);
        } catch (e) { showToast("Error: " + e.message); }
        finally { setSaving(false); }
      };

      const deletePricing = async (id) => {
        setSaving(true);
        try { await api(`/api/pricing/${id}`, { method: "DELETE" }); setPricing(p => p.filter(x => x.id !== id)); showToast("Plan deleted."); }
        catch (e) { showToast("Error: " + e.message); }
        finally { setSaving(false); }
      };

      const movePricing = async (id, dir) => {
        const arr = [...pricing]; const i = arr.findIndex(x => x.id === id); const j = i + dir;
        if (j < 0 || j >= arr.length) return;
        [arr[i], arr[j]] = [arr[j], arr[i]]; setPricing(arr);
        try { await Promise.all([api(`/api/pricing/${arr[i].id}`, { method: "PATCH", body: JSON.stringify({ sort_order: i }) }), api(`/api/pricing/${arr[j].id}`, { method: "PATCH", body: JSON.stringify({ sort_order: j }) })]); }
        catch (e) { showToast("Reorder failed: " + e.message); }
      };

      // ── Arrivals CRUD ────────────────────────────────────────────────────────
      const saveArrival = async (item) => {
        setSaving(true);
        try {
          const payload = { ...item };
          if (item.id) {
            const { id, created_at, ...fields } = payload;
            await api(`/api/arrivals/${item.id}`, { method: "PATCH", body: JSON.stringify(fields) });
            setArrivals(a => a.map(x => x.id === item.id ? { ...item } : x));
            showToast("Product updated!");
          } else {
            const row = await api("/api/arrivals", { method: "POST", body: JSON.stringify({ ...payload, sort_order: arrivals.length }) });
            setArrivals(a => [...a, row]);
            showToast("Product added!");
          }
          setModal(null);
        } catch (e) { showToast("Error: " + e.message); }
        finally { setSaving(false); }
      };

      const deleteArrival = async (id) => {
        if (!window.confirm("Delete this product?")) return;
        setSaving(true);
        try { await api(`/api/arrivals/${id}`, { method: "DELETE" }); setArrivals(a => a.filter(x => x.id !== id)); showToast("Product deleted."); }
        catch (e) { showToast("Error: " + e.message); }
        finally { setSaving(false); }
      };

      const moveArrival = async (id, dir) => {
        const arr = [...arrivals]; const i = arr.findIndex(x => x.id === id); const j = i + dir;
        if (j < 0 || j >= arr.length) return;
        [arr[i], arr[j]] = [arr[j], arr[i]]; setArrivals(arr);
        try { await Promise.all([api(`/api/arrivals/${arr[i].id}`, { method: "PATCH", body: JSON.stringify({ sort_order: i }) }), api(`/api/arrivals/${arr[j].id}`, { method: "PATCH", body: JSON.stringify({ sort_order: j }) })]); }
        catch (e) { showToast("Reorder failed: " + e.message); }
      };

      if (!token) return <LoginScreen onLogin={handleLogin} />;

      return (
        <div className="admin-s-39">

          {/* Header */}
          <div className="admin-s-40">
            <div className="admin-s-41">
              <img src="images/logo.webp" alt="Sewa Subidha Gardening" className="admin-s-42" />
              <div>
                <div className="admin-s-43">Sewa Subidha Gardening Admin</div>
                <div className="admin-s-44">
                  {loading ? "Connecting…" : "☁ Live — Railway PostgreSQL"}
                </div>
              </div>
            </div>
            <div className="admin-s-27">
              {["gallery", "pricing", "arrivals"].map(t => (
                <button key={t} onClick={() => setTab(t)} style={{ padding: "8px 20px", borderRadius: 100, border: "none", cursor: "pointer", fontSize: 13, fontWeight: 600, background: tab === t ? "#C8891A" : "rgba(255,255,255,0.1)", color: tab === t ? "#fff" : "rgba(255,255,255,0.7)", transition: "all 0.2s" }}>
                  {t === "gallery" ? <><i className="fa-regular fa-image admin-s-45"></i> Gallery</> : t === "pricing" ? <><i className="fa-solid fa-tags admin-s-45"></i> Pricing</> : <><i className="fa-solid fa-leaf admin-s-45"></i> Arrivals</>}
                </button>
              ))}
              <button onClick={handleLogout} className="admin-s-46">Sign Out</button>
            </div>
          </div>

          <div className="admin-s-47">

            {/* Error Banner */}
            {error && (
              <div className="admin-s-48">
                <span>⚠️ {error}</span>
                <button onClick={loadAll} className="admin-s-49">Retry</button>
              </div>
            )}

            {/* Spinner */}
            {loading && (
              <div className="admin-s-50">
                <div className="admin-s-51" />
                <p className="admin-s-52">Loading…</p>
              </div>
            )}

            {/* ── GALLERY TAB ── */}
            {!loading && tab === "gallery" && (
              <>
                <div className="admin-s-53">
                  <div>
                    <h2 className="admin-s-54">Portfolio Gallery</h2>
                    <p className="admin-s-55">{gallery.length} items · images hosted on Cloudinary</p>
                  </div>
                  <button onClick={() => setModal({ type: "gallery-new" })} style={{ padding: "9px 20px", background: "#2A5726", color: "#fff", border: "none", borderRadius: 100, cursor: "pointer", fontSize: 13, fontWeight: 600 }}>+ Add Item</button>
                </div>
                <div className="admin-s-56">
                  {gallery.map((item, idx) => (
                    <div key={item.id} className="admin-s-57">
                      {/* Thumbnail */}
                      <div style={{ width: 64, height: 52, borderRadius: 10, overflow: "hidden", flexShrink: 0, border: "1.5px solid #e0e8dc", background: item.bg }}>
                        {item.image && <img src={item.image} alt={item.title} className="admin-s-58" />}
                      </div>
                      <div className="admin-s-59">
                        <div className="admin-s-60">
                          <span className="admin-s-61">{item.title}</span>
                          <span style={{ background: catColors[item.cat] || "#6A9E5A", color: "#fff", fontSize: 10, fontWeight: 700, letterSpacing: 1, textTransform: "uppercase", padding: "2px 8px", borderRadius: 100 }}>{item.cat}</span>
                          <span className="admin-s-62">{item.budget}</span>
                        </div>
                        <div className="admin-s-63">{item.location} · {item.duration} · {item.service}</div>
                      </div>
                      <div className="admin-s-64">
                        <button onClick={() => moveGallery(item.id, -1)} disabled={idx === 0 || saving} style={{ width: 30, height: 30, border: "1.5px solid #d8e8d0", borderRadius: 8, background: "transparent", cursor: idx === 0 ? "not-allowed" : "pointer", opacity: idx === 0 ? 0.4 : 1, fontSize: 14 }}>↑</button>
                        <button onClick={() => moveGallery(item.id, 1)} disabled={idx === gallery.length - 1 || saving} style={{ width: 30, height: 30, border: "1.5px solid #d8e8d0", borderRadius: 8, background: "transparent", cursor: idx === gallery.length - 1 ? "not-allowed" : "pointer", opacity: idx === gallery.length - 1 ? 0.4 : 1, fontSize: 14 }}>↓</button>
                        <button onClick={() => setModal({ type: "gallery-edit", item })} style={{ padding: "6px 14px", background: "#e8f4e0", border: "1.5px solid #a8c89a", borderRadius: 100, cursor: "pointer", fontSize: 12, color: "#2A5726", fontWeight: 600 }}>Edit</button>
                        <button onClick={() => deleteGallery(item.id)} disabled={saving} style={{ padding: "6px 14px", background: "#fee2e2", border: "1.5px solid #fca5a5", borderRadius: 100, cursor: "pointer", fontSize: 12, color: "#dc2626", fontWeight: 600 }}>Delete</button>
                      </div>
                    </div>
                  ))}
                  {gallery.length === 0 && <div className="admin-s-65">No items yet. <button onClick={() => setModal({ type: "gallery-new" })} style={{ color: "#2A5726", background: "none", border: "none", cursor: "pointer", fontWeight: 600, fontSize: 14 }}>Add your first →</button></div>}
                </div>
              </>
            )}

            {/* ── PRICING TAB ── */}
            {!loading && tab === "pricing" && (
              <>
                <div className="admin-s-53">
                  <div>
                    <h2 className="admin-s-54">Pricing Plans</h2>
                    <p className="admin-s-55">{pricing.length} plans</p>
                  </div>
                  <button onClick={() => setModal({ type: "pricing-new" })} style={{ padding: "9px 20px", background: "#2A5726", color: "#fff", border: "none", borderRadius: 100, cursor: "pointer", fontSize: 13, fontWeight: 600 }}>+ Add Plan</button>
                </div>
                <div className="admin-s-66">
                  {pricing.map((plan, idx) => (
                    <div key={plan.id} style={{ background: "#fff", borderRadius: 20, padding: "24px", border: plan.popular ? "2px solid #2A5726" : "1.5px solid rgba(42,87,38,0.1)", position: "relative", boxShadow: plan.popular ? "0 8px 28px rgba(26,61,24,0.12)" : "0 2px 8px rgba(26,61,24,0.06)" }}>
                      {plan.popular && <span className="admin-s-67">Most Popular</span>}
                      <div className="admin-s-68"><i className="fa-solid fa-leaf admin-s-69"></i></div>
                      <div className="admin-s-70">{plan.name}</div>
                      <div className="admin-s-71">{plan.desc}</div>
                      <div className="admin-s-72">
                        <span className="admin-s-73">Rs.</span>
                        <span className="admin-s-74">{plan.price}</span>
                        <span className="admin-s-75">{plan.period}</span>
                      </div>
                      <div className="admin-s-76">{plan.note}</div>
                      <div className="admin-s-77">
                        {plan.features.map((f, i) => (
                          <div key={i} style={{ display: "flex", alignItems: "center", gap: 8, fontSize: 12, color: f.enabled ? "#4A4A44" : "#aaa", marginBottom: 6, opacity: f.enabled ? 1 : 0.6 }}>
                            <span style={{ color: f.enabled ? "#6A9E5A" : "#bbb", fontSize: 10 }}>{f.enabled ? "✓" : "✕"}</span>
                            {f.text}
                          </div>
                        ))}
                      </div>
                      <div className="admin-s-78">
                        <button onClick={() => movePricing(plan.id, -1)} disabled={idx === 0 || saving} style={{ width: 30, height: 30, border: "1.5px solid #d8e8d0", borderRadius: 8, background: "transparent", cursor: idx === 0 ? "not-allowed" : "pointer", opacity: idx === 0 ? 0.4 : 1 }}>↑</button>
                        <button onClick={() => movePricing(plan.id, 1)} disabled={idx === pricing.length - 1 || saving} style={{ width: 30, height: 30, border: "1.5px solid #d8e8d0", borderRadius: 8, background: "transparent", cursor: idx === pricing.length - 1 ? "not-allowed" : "pointer", opacity: idx === pricing.length - 1 ? 0.4 : 1 }}>↓</button>
                        <button onClick={() => setModal({ type: "pricing-edit", item: plan })} style={{ padding: "6px 14px", background: "#e8f4e0", border: "1.5px solid #a8c89a", borderRadius: 100, cursor: "pointer", fontSize: 12, color: "#2A5726", fontWeight: 600 }}>Edit</button>
                        <button onClick={() => deletePricing(plan.id)} disabled={saving} style={{ padding: "6px 14px", background: "#fee2e2", border: "1.5px solid #fca5a5", borderRadius: 100, cursor: "pointer", fontSize: 12, color: "#dc2626", fontWeight: 600 }}>Delete</button>
                      </div>
                    </div>
                  ))}
                  {pricing.length === 0 && <div className="admin-s-79">No plans yet. <button onClick={() => setModal({ type: "pricing-new" })} style={{ color: "#2A5726", background: "none", border: "none", cursor: "pointer", fontWeight: 600, fontSize: 14 }}>Add your first →</button></div>}
                </div>
              </>
            )}

            {/* ── ARRIVALS TAB ── */}
            {!loading && tab === "arrivals" && (
              <>
                <div className="admin-s-53">
                  <div>
                    <h2 className="admin-s-54">New Arrivals</h2>
                    <p className="admin-s-55">{arrivals.length} products · shown on arrival.html</p>
                  </div>
                  <button onClick={() => setModal({ type: "arrivals-new" })} style={{ padding: "9px 20px", background: "#2A5726", color: "#fff", border: "none", borderRadius: 100, cursor: "pointer", fontSize: 13, fontWeight: 600 }}>+ Add Product</button>
                </div>
                <div className="admin-s-56">
                  {arrivals.map((item, idx) => {
                    const badgeColors = { new: "#2A5726", hot: "#E85D35", sale: "#C8891A", limited: "#262622", best: "#6A9E5A" };
                    return (
                      <div key={item.id} className="admin-s-57">
                        {/* Thumbnail */}
                        <div className="admin-s-80">
                          {item.image ? <img src={item.image} alt={item.name} className="admin-s-58" /> : <i className={item.emoji || "fa-solid fa-leaf"} className="admin-s-69"></i>}
                        </div>
                        <div className="admin-s-59">
                          <div className="admin-s-60">
                            <span className="admin-s-61">{item.name}</span>
                            {item.latin_name && <span className="admin-s-81">{item.latin_name}</span>}
                            {item.badge && <span style={{ background: badgeColors[item.badge] || "#6A9E5A", color: "#fff", fontSize: 10, fontWeight: 700, letterSpacing: 1, textTransform: "uppercase", padding: "2px 8px", borderRadius: 100 }}>{item.badge}</span>}
                          </div>
                          <div className="admin-s-75">
                            <span className="admin-s-82">{item.cat_label || item.cat}</span>
                            {"★".repeat(Math.min(5, item.stars || 5))} <span className="admin-s-83">({item.review_count || 0})</span>
                          </div>
                        </div>
                        <div className="admin-s-64">
                          <button onClick={() => moveArrival(item.id, -1)} disabled={idx === 0 || saving} style={{ width: 30, height: 30, border: "1.5px solid #d8e8d0", borderRadius: 8, background: "transparent", cursor: idx === 0 ? "not-allowed" : "pointer", opacity: idx === 0 ? 0.4 : 1, fontSize: 14 }}>↑</button>
                          <button onClick={() => moveArrival(item.id, 1)} disabled={idx === arrivals.length - 1 || saving} style={{ width: 30, height: 30, border: "1.5px solid #d8e8d0", borderRadius: 8, background: "transparent", cursor: idx === arrivals.length - 1 ? "not-allowed" : "pointer", opacity: idx === arrivals.length - 1 ? 0.4 : 1, fontSize: 14 }}>↓</button>
                          <button onClick={() => setModal({ type: "arrivals-edit", item })} style={{ padding: "6px 14px", background: "#e8f4e0", border: "1.5px solid #a8c89a", borderRadius: 100, cursor: "pointer", fontSize: 12, color: "#2A5726", fontWeight: 600 }}>Edit</button>
                          <button onClick={() => deleteArrival(item.id)} disabled={saving} style={{ padding: "6px 14px", background: "#fee2e2", border: "1.5px solid #fca5a5", borderRadius: 100, cursor: "pointer", fontSize: 12, color: "#dc2626", fontWeight: 600 }}>Delete</button>
                        </div>
                      </div>
                    );
                  })}
                  {arrivals.length === 0 && (
                    <div className="admin-s-65">
                      No products yet.{" "}
                      <button onClick={() => setModal({ type: "arrivals-new" })} style={{ color: "#2A5726", background: "none", border: "none", cursor: "pointer", fontWeight: 600, fontSize: 14 }}>Add your first →</button>
                    </div>
                  )}
                </div>
              </>
            )}
          </div>

          {/* Modals */}
          {modal?.type === "gallery-new"    && <Modal title="Add Gallery Item"  onClose={() => setModal(null)}><GalleryForm token={token} onSave={saveGalleryItem} onClose={() => setModal(null)} loading={saving} /></Modal>}
          {modal?.type === "gallery-edit"   && <Modal title="Edit Gallery Item" onClose={() => setModal(null)}><GalleryForm token={token} item={modal.item} onSave={saveGalleryItem} onClose={() => setModal(null)} loading={saving} /></Modal>}
          {modal?.type === "pricing-new"    && <Modal title="Add Pricing Plan"  onClose={() => setModal(null)}><PricingForm onSave={savePricing} onClose={() => setModal(null)} loading={saving} /></Modal>}
          {modal?.type === "pricing-edit"   && <Modal title="Edit Pricing Plan" onClose={() => setModal(null)}><PricingForm plan={modal.item} onSave={savePricing} onClose={() => setModal(null)} loading={saving} /></Modal>}
          {modal?.type === "arrivals-new"   && <Modal title="Add New Arrival"   onClose={() => setModal(null)}><ArrivalsForm token={token} onSave={saveArrival} onClose={() => setModal(null)} loading={saving} /></Modal>}
          {modal?.type === "arrivals-edit"  && <Modal title="Edit Arrival"      onClose={() => setModal(null)}><ArrivalsForm token={token} item={modal.item} onSave={saveArrival} onClose={() => setModal(null)} loading={saving} /></Modal>}
          {toast && <Toast msg={toast} onClose={() => setToast(null)} />}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
